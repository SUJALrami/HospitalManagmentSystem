{% extends 'patient/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="px-8 py-6 border-b border-gray-200 bg-gray-100">
            <h3 class="text-xl font-bold text-gray-800 flex items-center">
                <span class="mr-2">🔎</span> Find a Doctor
            </h3>
        </div>
        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Select Department / Doctor</label>
                <div class="relative">
                    <select name="doctor" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none appearance-none bg-white">
                        <option value="" disabled selected>-- Choose a Specialist --</option>
                        {% for doc in doctors %}
                        <option value="{{ doc.id }}">
                            {{ doc.user }} ({{ doc.department }}) - Fee: ₹{{ doc.consultation_fee }}
                        </option>
                        {% endfor %}
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div >
                    <label class="block text-sm font-bold text-gray-700 mb-2">Date</label>
                    <input type="date" name="date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none"> 
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Time Slot</label>
                    <input type="time" name="time" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
            </div>
            <div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 transform hover:scale-[1.02]">Confirm Booking</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
