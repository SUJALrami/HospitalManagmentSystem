{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Health Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden font-sans">
    <div class="w-64 bg-purple-700 text-white flex flex-col shadow-xl flex-shrink-0">
        <div class="h-16 flex items-center justify-center border-b border-purple-800 bg-purple-800">
            <h2 class="text-xl font-bold tracking-wide">👤 My Portal</h2>
        </div>
        <nav class="flex-1 px-2 py-4 space-y-2 overflow-y-auto">
            <a href="{% url 'patient_dashboard' %}" class="flex items-center px-4 py-3 rounded hover:bg-purple-600 transition duration-200">
                <span class="mr-3 text-lg">🏠</span> Home
            </a>
            <a href="{% url 'book_appointment' %}" class="flex items-center px-4 py-3 rounded hover:bg-purple-600 transition duration-200">
                <span class="mr-3 text-lg">📅</span> Book Doctor
            </a>
            <a href="{% url 'my_bills' %}" class="flex items-center px-4 py-3 rounded hover:bg-purple-600 transition duration-200">
                <span class="mr-3 text-lg">💸</span> My Bills
            </a>
        </nav>
        <div class="p-4 border-t border-purple-800 bg-purple-800">
            <a href="{% url 'custom_login' %}" class="block w-full bg-purple-900 hover:bg-purple-950 text-white text-center font-bold py-2 rounded transition duration-200">
                Logout
            </a>
        </div>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <main class="flex-1 overflow-x-hidden overflow-y-auto p-8">
            {% if messages %}
                <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-4 rounded-lg shadow-sm text-sm font-semibold flex items-center
                        {% if message.tags == 'error' %} bg-red-100 text-red-700 border-l-4 border-red-500
                        {% elif message.tags == 'success' %} bg-green-100 text-green-700 border-l-4 border-green-500
                        {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
            
        </main>
    </div>
</body>
</html>
