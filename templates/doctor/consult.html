{% extends 'doctor/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    
    <div class="bg-white rounded-lg shadow-md p-6 mb-6 border-l-4 border-blue-500">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Prescription for: <span class="text-blue-600">{{ appt.patient.name }}</span></h2>
        <div class="flex gap-6 text-sm text-gray-600 bg-gray-50 p-4 rounded-lg">
            <div><span class="font-bold">Age:</span> {{ appt.patient.age }}</div>
            <div><span class="font-bold">Gender:</span> {{ appt.patient.gender }}</div>
            <div><span class="font-bold">Phone:</span> {{ appt.patient.phone }}</div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-8">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div >
                <label class="block text-sm font-bold text-gray-700 mb-2">Diagnosis (Clinical Findings)</label>
                <input type="text" name="diagnosis" placeholder="e.g. Viral Fever, Migraine..." required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Medicines (Rx)</label>
                <textarea name="medicine" rows="4" placeholder="1. Tab Paracetamol..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none font-mono"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Advice / Notes</label>
                <textarea name="notes" rows="2" placeholder="Rest for 2 days..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition duration-200">Complete Consultation & Generate Bill</button>
        </form>
    </div>
</div>
{% endblock %}
