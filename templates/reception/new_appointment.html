{% extends 'reception/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200">
        
        <div class="px-8 py-5 border-b border-gray-200 bg-gray-50 flex items-center gap-3">
            <span class="text-2xl">📅</span>
            <h3 class="text-xl font-bold text-gray-800">Book New Appointment (Walk-In)</h3>
        </div>
        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Patient Phone Number</label>
                <div class="relative">
                    <input type="text" name="phone" id="phoneInput" placeholder="Enter Phone" required class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    <span class="absolute left-3 top-3.5 text-gray-400">📞</span>
                </div>
                <p class="text-xs text-gray-500 mt-2 ml-1">
                    ℹ️ If the patient exists, we will find them. If not, please fill the details below.
                </p>
            </div>


            <div class="bg-gray-50 p-6 rounded-lg border border-gray-200">
                <h4 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-4 border-b border-gray-200 pb-2">
                    New Patient Details (Optional)
                </h4>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Patient Name</label>
                        <input type="text" name="name" placeholder="Full Name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div >
                            <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                            <input type="number" name="age" placeholder="Age" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        </div>
                        <div >
                            <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                            <select name="gender" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                                <option value="O">Other</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Select Doctor</label>
                <select name="doctor" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="" disabled selected>-- Choose a Specialist --</option>
                    {% for doc in doctors %}
                    <option value="{{ doc.id }}">
                        {{ doc.user }} ({{ doc.department }})  - Fee: ₹{{ doc.consultation_fee }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="block text-sm font-bold text-gray-700 mb-2">
                    <label>Date</label>
                    <input type="date" name="date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Time Slot</label>
                    <input type="time" name="time" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-600">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 transform hover:scale-[1.01]">
                    Confirm Booking
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
